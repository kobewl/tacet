# tacet 编译缓存治理
#
# 背景：target/ 曾达 14 GB，其中 debug/incremental 一项就占 3.7 GB
# （224 个会话目录 —— 这是本项目最大的浪费项）。
# 本文件位于工作区根目录，会被 crates/* 与 apps/* 下所有 cargo 调用自动读取，
# 因此 IDE 与 AI 编码助手发起的构建同样受约束，不依赖各人 shell 环境变量。

# ── 成因一：增量编译缓存无限累积 ──────────────────────────────────
# Cargo 每次编译配置变化就新开一个 incremental 会话目录，旧目录永不回收。
# 实测累积 224 个会话目录、3.7 GB。关闭后不再产生这类目录。
# 代价：改动少量代码后需重新编译该 crate 而非增量补丁，单次编译略慢。
[profile.dev]
incremental = false

# ── 成因二：调试符号撑大中间产物 ──────────────────────────────────
# 默认 debug = 2（完整符号）。降到 1 只保留行号表 + 函数名：体积约降 10%，
# 且 panic backtrace 仍能显示 文件:行号。
# 若完全不需要原生调试、想再省（约 22%），可改为 debug = false —— 代价是
# backtrace 不再显示行号。
debug = 1

# ── 成因三：外部环境可能覆盖 ──────────────────────────────────────
# 与上面等效的环境变量形式；force 保证不被外层已设置的 CARGO_INCREMENTAL 覆盖。
[env]
CARGO_INCREMENTAL = { value = "0", force = true }
