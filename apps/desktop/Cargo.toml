[package]
name = "tacet-desktop"
description = "Tacet 桌面应用壳（Tauri 2）：窗口管理、托盘、IPC 与后台调度"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "tacet-desktop"

[lib]
# Tauri 要求有一个 lib 目标才能正确生成移动端入口；
# 桌面端也用得上 —— 测试可以 import 这里的纯逻辑。
name = "tacet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心六件套
tacet-core.workspace = true
tacet-context.workspace = true
tacet-health.workspace = true
tacet-storage.workspace = true
tacet-platform.workspace = true
platform-macos = { path = "../../crates/platform-macos" }

tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# 应用内自动更新。更新包由 minisign 私钥签名（发布时通过
# TAURI_SIGNING_PRIVATE_KEY 提供），本插件用 tauri.conf.json 里的公钥验签，
# 验不过直接拒装 —— 下载链路被替换的包进不来。
# 与 Apple 代码签名无关：未签名的个人测试包也能用这一套。
tauri-plugin-updater = "2"
# 用系统默认浏览器打开外部链接（更新失败时的手动下载兜底）。
# 只在 Rust 侧调用，前端没有开这个权限。
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Tauri 官方模板的默认特性组合：custom-protocol 用于生产构建，
# 开发模式下走 devUrl。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
# 用于「开机自启」（库层只能用 SMAppService，需要 bundle 身份）
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
# 用于告诉 macOS「登录时不要用恢复窗口的方式再拉起我一遍」——
# 不关掉这条路径，设置页里的自启开关就是坏的（关掉了也照样自启）。
# 见 src/autostart.rs 的说明。
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
] }

[dev-dependencies]
tempfile = "3"
