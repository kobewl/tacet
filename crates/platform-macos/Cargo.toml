[package]
name = "platform-macos"
description = "Tacet 平台层 macOS 实现（Apple Silicon 优先）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# 架构文档 §4「平台层」：只有 platform-* 实现 crate 允许出现平台条件编译。
# 这里用 cfg 限定整包只在 macOS 上参与编译，其它平台得到空实现。
[target.'cfg(target_os = "macos")'.dependencies]
tacet-core.workspace = true
tacet-platform.workspace = true
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSScreen", "NSApplication"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
